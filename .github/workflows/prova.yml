name: Prova Renfe

on:
  push:
    branches: [main]
    paths: [".github/workflows/prova.yml", "renfe.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instal·lar Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Cercar anada (Girona -> Camp de Tarragona, 13/11)
        run: node renfe.mjs 79300 04104 2026-11-13 || true
      - name: Desar resultat al repositori
        run: |
          mkdir -p proves
          mv resultat-prova.json proves/ 2>/dev/null || echo '{"ok":false,"log":["sense resultat"]}' > proves/resultat-prova.json
          mv debug.png debug.txt proves/ 2>/dev/null || true
          git config user.name "trens-bot"
          git config user.email "trens-bot@users.noreply.github.com"
          git add proves
          git commit -m "Resultat de la prova [skip ci]" || echo "res a desar"
          git push
