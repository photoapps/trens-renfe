name: Revisar preus AVE

on:
  schedule:
    # Hora UTC. A l'hivern equival a 8:43, 12:43, 18:43 i 22:43 a Espanya (a l'estiu, una hora més tard).
    - cron: "43 7,11,17,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revisar
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instal·lar Playwright i Nodemailer
        run: |
          npm init -y >/dev/null
          npm install playwright@1.48.2 nodemailer@6.9.16
          npx playwright install --with-deps chromium
      - name: Revisar preus a Renfe
        env:
          SUPABASE_CLAVE: ${{ secrets.SUPABASE_CLAVE }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: node revisar.mjs
      - name: Desar l'última revisió (manté el repositori actiu)
        if: always()
        run: |
          git config user.name "trens-bot"
          git config user.email "trens-bot@users.noreply.github.com"
          git add ultima-revisio.json 2>/dev/null || true
          git commit -m "Última revisió [skip ci]" || echo "res a desar"
          git pull --rebase -q || true
          git push || true
